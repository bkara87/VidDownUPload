name: 🚀 Build & Release v1.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 🔨 Build Executable & Setup Installer
        run: |
          python build_installer.py

      - name: 🏷️ Get Release Version
        id: get_version
        shell: pwsh
        run: |
          $ver = (Get-Content version.json | ConvertFrom-Json).version
          echo "VERSION=v$ver" >> $env:GITHUB_ENV
          echo "SETUP_NAME=VidDownUPload_Setup_v$ver" >> $env:GITHUB_ENV

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "VidDownUPload ${{ env.VERSION }} — Ultra Premium Studio 🎨"
          draft: false
          prerelease: false
          files: |
            dist/VidDownUPload_Setup_*.exe
          body: |
            ## VidDownUPload ${{ env.VERSION }} — Ultra Premium Güncelleme 🚀

            ### ✨ Bu Sürümdeki Yenilikler:

            **🎨 Ultra Premium Arayüz:**
            - Obsidian siyah glassmorphism tasarım
            - Deep Violet gradient vurgu rengi
            - 32 çubuklu smooth spectrum equalizer (mirror-simetrik, idle breathing)
            - Cinematic video kart tasarımı (thumbnail frame, işlendi badge)
            - Premium log terminal (Cascadia Code, yeşil terminal metin)

            **📤 Platform Yükleme (Gerçek API'ler):**
            - ▶️ **YouTube Shorts** — OAuth2 + Resumable Upload
            - 🎵 **TikTok** — Content Posting API v2 (chunk upload)
            - 📘 **Facebook Reels** — Meta Graph API + rupload streaming
            - 🧵 **Threads** — Meta Graph API entegrasyonu
            - 📸 **Instagram** — Streaming upload (RAM dostu)

            **⚡ Performans:**
            - 800ms debounce URL bilgi çekme
            - URL önbelleği (tekrar yt-dlp çalışmaz)
            - PIL önbelleği ile video preview ~5x hızlandı
            - boxFilter blur ile blur işleme ~5x hızlı

            **🎥 Görsel Kalite:**
            - FFmpeg slow preset, CRF 18, 192k ses, faststart
            - H.264 High Profile mobil uyumlu çıktı
            - Kalite seçim dropdown (Hızlı / Yüksek / Maksimum)

            ---
            📥 **Kurulum için `VidDownUPload_Setup_${{ env.VERSION }}.exe` dosyasını indirin.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
